name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all]" --group dev
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all]" --group dev
      - run: pytest --cov --cov-report=term-missing:skip-covered

  light-install:
    name: Base install only (what Nova and other apps get)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest
      - run: python -c "import itops_rag, sys; from itops_rag import Index, Settings; print(itops_rag.__version__)"
      - run: pytest tests/test_chunking.py tests/test_redact.py tests/test_retrieval.py tests/test_generate.py tests/test_prompts.py tests/test_loaders.py -q

  eval-gate:
    name: Retrieval eval gate (offline, no API key)
    runs-on: ubuntu-latest
    needs: test
    env:
      ITOPS_RAG_MODEL_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
      ITOPS_RAG_INDEX_DIR: ${{ github.workspace }}/.itops-rag/index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: .fastembed_cache
          key: fastembed-minilm-msmarco-v1
      - run: pip install .
      - run: itops-rag ingest data/demo/kestrel-cloud --store sqlite
      - run: itops-rag eval --baseline eval/baseline.json --report eval-report.md
      - run: cat eval-report.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t itops-rag:ci .
      - run: docker run -d --name itops -p 8080:8080 itops-rag:ci
      - name: Wait for health and query the API
        run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -sf "http://127.0.0.1:8080/api/search?q=AADSTS53003&k=2" | python3 -c "import json,sys; h=json.load(sys.stdin); assert h, 'no hits'; print(h[0]['doc_id'])"
      - if: failure()
        run: docker logs itops
