name: Release to PyPI

# Push a tag like v0.1.0 to build and publish. Uses PyPI trusted publishing (OIDC): no token is stored anywhere.
# One-time setup on pypi.org: add a trusted publisher for chamu262/itops-rag, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Only the public repo publishes. The private repo (which merges this file) must never release.
    if: github.repository == 'chamu262/itops-rag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
