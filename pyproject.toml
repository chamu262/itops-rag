[project]
name = "itops-rag"
version = "0.1.0"
description = "Retrieval-augmented answers for IT operations: hybrid search, local reranking, cited answers from Claude, an MCP server and a reusable RAG engine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chamudith Amarasinghe" }]
keywords = ["rag", "retrieval", "it-operations", "claude", "mcp", "sqlite-vec", "chromadb", "jamf", "intune", "entra"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# Base install: everything needed to ingest, search (hybrid + rerank, all local) and answer with Claude.
# No torch, no server. Heavier pieces are opt-in extras.
dependencies = [
  "anthropic>=2.10",  # server-side fallbacks ("fallbacks" + server-side-fallback beta)
  "fastembed>=0.6",
  "numpy>=1.26",
  "sqlite-vec>=0.1.6",
  "pydantic>=2.7",
  "pydantic-settings>=2.7",  # NoDecode for list settings from env
  "pyyaml>=6.0",
  "pypdf>=5.0",
  "beautifulsoup4>=4.12",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]

chroma = ["chromadb>=1.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
mcp = ["mcp>=2.0"]
slack = ["slack-bolt>=1.20"]
langchain = ["langchain-core>=0.3"]
all = ["itops-rag[chroma,web,mcp,slack,langchain]"]

[project.urls]
Homepage = "https://github.com/chamu262/itops-rag"
Issues = "https://github.com/chamu262/itops-rag/issues"

[project.scripts]
itops-rag = "itops_rag.interfaces.cli:app"
itops-rag-mcp = "itops_rag.interfaces.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-pyyaml",
  "httpx>=0.27",
  "fpdf2>=2.7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itops_rag"]

[tool.hatch.build.targets.sdist]
include = ["/src/itops_rag", "/README.md", "/LICENSE", "/pyproject.toml"]

# This project installs from public PyPI only, regardless of any machine-level index config.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "models: needs the local ONNX embedding/rerank models (downloaded on first use)",
  "slow: slower end-to-end tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["itops_rag"]
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["fastembed.*", "chromadb.*", "sqlite_vec.*", "slack_bolt.*", "mcp.*", "langchain_core.*", "pypdf.*", "bs4.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["itops_rag"]
omit = ["src/itops_rag/interfaces/slack_bot.py"]
