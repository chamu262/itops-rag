# Slack app manifest for the itops-rag bot stub (Socket Mode, no public URL needed).
# Create the app from this manifest, install it, then set SLACK_BOT_TOKEN and SLACK_APP_TOKEN.
display_information:
  name: IT Ops RAG
  description: Cited answers from IT runbooks, KB articles and past tickets.
features:
  bot_user:
    display_name: itops
    always_online: false
  slash_commands:
    - command: /itops
      description: Ask the IT knowledge base
      usage_hint: "MeshGate shows MG-401 after the macOS update"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
